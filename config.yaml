baseURL: https://jesuspavonabian.es
languageCode: es-es
title: El Blog de un informático que sueña con mejorar el mundo
theme: indiepaper
enableRobotsTXT: true

paginate: 12

params:
  description: La tecnología debe estar al servicio de las personas.
  mainSections:
    - post
  author:
    name: Jesús Pavón Abián
    email: correo@jesuspavonabian.es
    url: https://jesuspavonabian.es
    bio: La tecnología debe estar al servicio de las personas.
    twitter: jpa_apj
  indieweb:
    webmention_endpoint: https://webmention.io/jesuspavonabian.es/webmention
    webmention_api: https://webmention.io/api/mentions.jf2
    token_endpoint: https://tokens.indieauth.com/token
    authorization_endpoint: https://indieauth.com/auth
    micropub_endpoint: https://jesuspavonabian.es/netlify/functions/micropub
    microsub_endpoint: https://aperture.p3k.io/microsub/969
  social:
    - name: Mastodon
      url: https://mst.universoalterno.es/@jpavonabian
    - name: GitHub
      url: https://github.com/jpavonabian
    - name: Twitter
      url: https://twitter.com/jpa_apj

taxonomies:
  tag: tags
  category: categories

# Static del tema que no es del blog (zip del tema, capturas, favicons de ejemplo)
module:
  imports:
    - path: indiepaper
      mounts:
        - source: archetypes
          target: archetypes
        - source: assets
          target: assets
        - source: data
          target: data
        - source: i18n
          target: i18n
        - source: layouts
          target: layouts
        - source: static
          target: static
          excludeFiles:
            - favicon/**
            - indiepaper-theme.zip
            - lighthouse.jpg
            - screenshot.jpg
            - author-photo.svg

outputs:
  home: [HTML, RSS, JSON]
  page: [HTML]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

outputFormats:
  RSS:
    mediatype: application/rss+xml
    baseName: feed
  JSON:
    mediatype: application/json
    baseName: feed

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: dracula
